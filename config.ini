[telegram]
; enabled:
;   true  - надсилати повідомлення в Telegram (про знайдений матч / ping / таймаут)
;   false - Telegram повністю вимкнено (скрипт працює без нього)
enabled = false

; token:
;   Токен бота з @BotFather (вигляд: 123456:ABC-DEF...)
;   Порада: НЕ публікуй токен ніде. Якщо “засвітив” — перевипусти в @BotFather.
token = 123456:ABC-DEF

; chat_id:
;   Куди надсилати повідомлення:
;   - твій особистий chat_id (число), або
;   - @username каналу/групи (якщо бот доданий туди і має права писати)
;   Отримати chat_id можна через бота типу @Get_myidrobot
chat_id = 666777666


[app]
; start_enabled:
;   true  - моніторинг логу увімкнений відразу після запуску
;   false - моніторинг стартує вимкненим (увімкнеш вручну через трей)
start_enabled = true

; bring_cs2_to_front:
;   true  - коли матч знайдено, спробує вивести вікно CS2 на передній план (щоб швидше прийняти)
;   false - не чіпає вікно гри
bring_cs2_to_front = true

; beep_on_match:
;   true  - короткий системний “біп” при знаходженні матчу
;   false - без звуку
beep_on_match = false

; reservation_cooldown_sec:
;   Анти-дубль для повідомлення ReservationExpired.
;   У CS2 часто приходить 2 рази підряд, тому скрипт показує/шле таймаут тільки 1 раз
;   протягом цього часу (в секундах). Рекомендовано 3–10.
reservation_cooldown_sec = 5

; y_cordinate:
;   корегування координати адже кнопка  не завжди в центрі
;   наприклад 100 це підніме мишку на 100 пікселів вгору
y_cordinate = 100


[console]
; enabled_default:
;   true  - при запуску програми консоль/логування увімкнене
;   false - при запуску вимкнене (рекомендовано для .exe)
; Важливо: перемикач у треї НЕ змінює config.ini, тому після перезапуску буде знову як тут.
enabled_default = false


[log]
; auto:
;   true  - шлях до console.log шукається автоматично:
;           1) пробує Steam через Windows PATH
;           2) якщо не знайде — через реєстр Steam
;           3) читає steamapps\libraryfolders.vdf і перевіряє бібліотеки
;   false - використовує manual_path нижче
auto = true

; manual_path:
;   Ручний шлях до CS2 console.log (потрібен тільки якщо auto=false або auto не спрацьовує)
manual_path = D:\SteamLibrary\steamapps\common\Counter-Strike Global Offensive\game\csgo\console.log

;match_keyword
; слово на яке реагує скрипт після чого приймає катку
match_keyword = match_id